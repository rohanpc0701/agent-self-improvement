[project]
name = "agent-self-improvement"
version = "0.3.0"
description = "Teacher-built frozen memory for runtime self-improvement of reasoning models (no fine-tuning)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "networkx>=3.0",
]

[tool.setuptools]
packages = ["contracts", "core", "adapters", "analysis", "harness", "correction"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["harness/tests", "correction/tests", "tests"]
